# git-cliff 配置文件
# 文档地址: https://git-cliff.org/docs/configuration

[changelog]
# 变更日志渲染模板（使用 Tera 模板引擎）
# 语法参考: https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
# 移除正文首尾的多余空格/空行
trim = true
# 即使没有需要发布的改动，依然渲染正文
render_always = true
# 基于正则的后处理器数组，用于在生成后修改变更日志内容
postprocessors = [
  # 将占位符 <REPO> 替换为仓库的实际 URL
  #{ pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" },
]
# 变更日志的输出文件路径（可选，未指定时可通过命令行参数 --output 指定）
# output = "CHANGELOG.md"

[git]
# 按照 Conventional Commits（约定式提交）规范解析提交信息
# 参考: https://www.conventionalcommits.org
conventional_commits = true
# 过滤掉不符合约定式提交规范的 commit
filter_unconventional = true
# 要求所有提交都必须符合规范（优先级高于 filter_unconventional）
require_conventional = false
# 是否按换行符拆分多行提交，将每一行都作为单独的 commit 处理
split_commits = false
# 基于正则的预处理器数组，在进一步分类处理前先清洗/改写提交信息
commit_preprocessors = [
  # 将 Issue 编号替换为 Markdown 超链接（需配合 changelog.postprocessors）
  #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
  # 使用 typos 工具检查提交信息拼写，若有拼写错误会自动修复
  #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# 防止包含破坏性变更（Breaking Changes）的提交被 commit_parsers 规则过滤排除
protect_breaking_commits = false
# 基于正则的提交分类解析器：从提交信息提取数据并分配到特定分组
# 可选设置 commit 的 scope，或将特定提交直接跳过（skip = true）
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# 是否排除未被任何 commit_parser 规则匹配到的提交
filter_commits = false
# 当遇到未匹配任何 commit_parser 规则的提交时，是否直接中断报错
fail_on_unmatched_commit = false
# 基于正则的链接解析器数组，用于提取外部引用并转为 URL
link_parsers = []
# 是否只包含属于当前分支的 Git Tag
use_branch_tags = false
# 按拓扑顺序对版本（Releases）进行排序（而非默认的时间先后顺序）
topo_order = false
# 按拓扑顺序对提交（Commits）进行排序（而非默认的时间先后顺序）
topo_order_commits = true
# 每个分组/版本内部 commit 的排序方式。可选值: newest（最新在前）, oldest（最旧在前）
sort_commits = "oldest"
# 是否递归处理 Git 子模块（Submodules）中的提交
recurse_submodules = false

[remote.github]
owner = "AlfredClark"
repo = "tauri-desktop-template"
