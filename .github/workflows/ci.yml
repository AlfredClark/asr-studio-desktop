name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            frontend:
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'svelte.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'tsconfig.aliases.json'
              - 'eslint.config.ts'
              - 'components.json'
              - 'scripts/**'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
            backend:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'src/libs/commands/bindings.ts'
              - 'deny.toml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  frontend:
    name: Validate Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: pnpm/setup@v2
        with:
          # pnpm 版本唯一来源是 package.json 的 packageManager，不在此重复声明 version
          runtime: node@24
          cache: true

      - name: I18n
        run: pnpm run i18n:compile

      - name: Lint
        run: pnpm run lint:frontend

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test:vitest

      - name: Build
        run: pnpm run build

  backend:
    name: Validate Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl wget file

      - name: Toolchain
        # toolchain 版本必须与 rust-toolchain.toml 保持一致
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Format
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path Cargo.toml --workspace

      # 导出测试会重写 bindings.ts，若与提交内容不一致说明忘记重新生成绑定
      - name: Test
        run: cargo test --manifest-path Cargo.toml --workspace

      - name: Bindings
        run: git diff --exit-code src/libs/commands/bindings.ts

  backend-windows:
    name: Check Windows Target
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Windows 专属代码（Win32 FFI、DirectML/CUDA 底座对接、全局快捷键）在 ubuntu 上永不编译，
    # 曾出现“本地全绿、release 打包才爆”的断层；此 job 在原生 Windows 上只做 check，
    # 不跑测试（sherpa-onnx 预编译库下载慢）不打断冒烟节奏
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        # toolchain 版本必须与 rust-toolchain.toml 保持一致
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check
        run: cargo check --manifest-path Cargo.toml --workspace --all-targets

  ci-passed:
    name: Passed
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, backend-windows]
    if: always()

    steps:
      - name: Evaluate Results
        run: |
          echo "Changes:  ${{ needs.changes.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend:  ${{ needs.backend.result }}"
          echo "Windows:  ${{ needs.backend-windows.result }}"

          # changes 失败时前后端会被跳过，门禁必须一并拦住，否则会"安全通过"
          if [[ "${{ needs.changes.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.frontend.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.backend.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.backend-windows.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "::error::One or more essential checks failed."
            exit 1
          fi
          echo "All checks passed or were safely skipped!"
          exit 0
