[package]
name = "asr-studio-desktop"
version = "1.0.0"
edition = "2024"
authors = ["Alfred Clark"]
description = "Local ASR desktop application."
repository = "https://github.com/AlfredClark/asr-studio-desktop"
keywords = ["tauri", "desktop", "asr", "studio"]
categories = ["gui"]
readme = "../README.md"
license = "GPL-3.0-only"

[lib]
name = "asr_studio_desktop_lib"
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
# 作为 Rust 库使用（系统语言与平台信息采集，见 cores/config.rs / cores/system.rs），未注册 JS API
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "4.2.1"
chrono = "0.4.45"
log = "0.4.34"
thiserror = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
anyhow = "1.0.104"
tauri-plugin-system-fonts = "2.0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", features = ["stream"] }
tar = "0.4.46"
bzip2 = "0.6.1"
futures-util = "0.3.34"
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time"] }
sherpa-onnx = "1.13.8"
cpal = "0.18.2"
hound = "3.5.1"
enigo = "0.6.1"
# 词库拼音：逐字取最常用读音（多音字靠词条显式拼音兜底）
pinyin = "0.11"
# 词库多模式匹配：音节流上的重叠匹配，仲裁逻辑手写
aho-corasick = "1"

[target.'cfg(unix)'.dependencies]
# 磁盘空间预检（statvfs）：模型下载前拒绝空间不足，已在依赖树内，无新增传递依赖
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# 输出前焦点预检（X11 根窗口判定）：经 tauri 引入，已在依赖树内，无新增传递依赖
x11rb = "0.13"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
