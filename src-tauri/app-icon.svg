<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 24 24"
  fill="none"
>
  <!--
    ASR Studio 应用图标源：本地语音波形，与 `src/assets/icons/app-icon.svelte` 同源几何
    （viewBox 0 0 24 24，标称尺寸 1024×1024，正方形）；
    对外显示用白色圆角矩形底，波形用纯黑填充；
    内联 `app-icon.svelte` 组件保持透明无背景，改几何时两处同步。
  -->
  <rect x="0" y="0" width="24" height="24" rx="3" fill="#FFFFFF" />
  <rect x="3" y="9" width="2" height="6" rx="1" fill="#000000" />
  <rect x="7" y="7" width="2" height="10" rx="1" fill="#000000" />
  <rect x="11" y="4" width="2" height="16" rx="1" fill="#000000" />
  <rect x="15" y="7" width="2" height="10" rx="1" fill="#000000" />
  <rect x="19" y="9" width="2" height="6" rx="1" fill="#000000" />
</svg>
